[project]
name = "memory-pattern-examples"
version = "0.1.0"
description = "Agent memory & retrieval patterns over MongoDB (Deep Agents + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Notebook runtime (for deep_agents_mongodb.ipynb)
    "jupyter>=1.1.1",
    "notebook>=7.4.7",
    "ipywidgets>=8.1.0",
    # LangChain / LangGraph / Deep Agents
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langgraph>=1.2",
    "langsmith>=0.12",
    "deepagents>=0.7.15",
    # Model + embedding providers
    "langchain-openai>=1.0.1",
    "langchain-huggingface[full]>=1.0",
    # MongoDB persistence
    "pymongo>=4.9,<4.17",
    "langgraph-store-mongodb>=0.4.0",
    "langgraph-checkpoint-mongodb>=0.5.0",
    # Config
    "python-dotenv>=1.1.1",
]

[dependency-groups]
# Optional: the notebook's production VFS section (S3-backed searchable filesystem).
#   uv sync --group vfs
vfs = [
    "langchain-mongodb-deepagents-vfs>=0.1.0",
    "boto3>=1.34",
]

[tool.uv]
# This repo is a runnable example set, not an installable package.
package = false
